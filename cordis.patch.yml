# dsh-riskproof bundle patch — inserts the RiskProof security plugin as one
# row over the profile root. Later bundle patches and the user's profile
# cordis.patch.yml may override this row's `config` (last write wins).
#
# RiskProof hooks `tools/pre-execute` (allow/ask/deny before dispatch) and
# `tools/result` (provenance + toolchain state). It is a passive layer over the
# Tool Runtime: it does not register tools of its own, so row order carries no
# load semantics.

- insert:
    - id: riskproof
      name: dsh-riskproof
      # Keep this explicit: DSH loader rows without a `config` key pass
      # `undefined`, while RiskProof's defaults are defined for an object.
      config: {}
      # Override this row from the profile's cordis.patch.yml to tune policy;
      # see docs/configuration.md in the package repository.
